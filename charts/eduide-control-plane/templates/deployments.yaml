{{- $full := include "ecp.fullname" . }}
{{- $sum := include "ecp.config" . | sha256sum }}
{{- $svcPorts := list (dict "name" "http" "port" 8080) (dict "name" "metrics" "port" 9090) }}
{{- /* The internal listener of the service (Git authorize, ADR 0023) is only there with providers. */}}
{{- if include "ecp.gitEnabled" . }}{{ $svcPorts = append $svcPorts (dict "name" "internal" "port" 8083) }}{{ end }}
{{- $comps := list
  (dict "name" "operator" "v" .Values.operator "ports" (list (dict "name" "metrics" "port" 9464) (dict "name" "health" "port" 8081)) "probe" 8081 "strategy" "Recreate")
  (dict "name" "service" "v" .Values.service "ports" $svcPorts "probe" 9090)
  (dict "name" "authz" "v" .Values.authz "ports" (list (dict "name" "grpc" "port" 9001) (dict "name" "metrics" "port" 9090)) "probe" 9090) }}
{{- /* git-proxy keeps a running clone going for up to 60 s on shutdown; it sits behind a ClusterIP Service, so the drain is short. */}}
{{- if include "ecp.gitEnabled" . }}
{{- $comps = append $comps (dict "name" "git-proxy" "v" .Values.gitProxy "ports" (list (dict "name" "git" "port" 8080) (dict "name" "metrics" "port" 9090)) "probe" 9090 "drain" 5 "grace" 70) }}
{{- end }}
{{- range $c := $comps }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $full }}-{{ $c.name }}
  labels:
    {{- include "ecp.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $c.name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-{{ $c.name }}
  labels:
    {{- include "ecp.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $c.name }}
spec:
  replicas: {{ $c.v.replicas }}
  {{- with $c.strategy }}
  strategy:
    type: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ecp.selector" (dict "ctx" $ "component" $c.name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ecp.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $c.name }}
      annotations:
        checksum/config: {{ $sum }}
    spec:
      serviceAccountName: {{ $full }}-{{ $c.name }}
      {{- if eq $c.name "git-proxy" }}
      automountServiceAccountToken: false
      {{- end }}
      securityContext:
        {{- include "ecp.podSecurityContext" $ | nindent 8 }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if ne $c.name "operator" }}
      # Envoy Gateway takes up to a minute or more to drop a pod from its endpoints; keep serving meanwhile.
      terminationGracePeriodSeconds: {{ $c.grace | default (add $.Values.endpointDrainSeconds 15) }}
      {{- end }}
      containers:
      - name: {{ $c.name }}
        image: {{ include "ecp.image" (dict "ctx" $ "name" $c.name) }}
        imagePullPolicy: {{ $.Values.image.pullPolicy }}
        args: [--config, /etc/eduide/config.yaml]
        {{- if ne $c.name "operator" }}
        lifecycle:
          preStop:
            sleep: {seconds: {{ $c.drain | default $.Values.endpointDrainSeconds }}}
        {{- end }}
        env:
        - name: LOG_LEVEL
          value: {{ $c.v.logLevel | default "info" | quote }}
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        {{- range $c.ports }}
        - {name: {{ .name }}, containerPort: {{ .port }}}
        {{- end }}
        readinessProbe:
          httpGet: {path: /readyz, port: {{ $c.probe }}}
        livenessProbe:
          httpGet: {path: /healthz, port: {{ $c.probe }}}
        resources:
          {{- toYaml $c.v.resources | nindent 10 }}
        securityContext:
          {{- include "ecp.containerSecurityContext" $ | nindent 10 }}
        volumeMounts:
          {{- if eq $c.name "git-proxy" }}
          {{- /* No user salt: git-proxy does not need it, and authz derives its session cookie key from it. */}}
          - {name: config, mountPath: /etc/eduide/config.yaml, subPath: config.yaml, readOnly: true}
          - {name: tmp, mountPath: /tmp}
          {{- else }}
          {{- include "ecp.mounts" $ | nindent 10 }}
          {{- end }}
          {{- if and (eq $c.name "service") (include "ecp.gitEnabled" $) }}
          - {name: git-accounts, mountPath: /etc/eduide/git-accounts, readOnly: true}
          {{- end }}
          {{- /* CA bundles of Git hosts with a private CA: public certificates, read by the service and the git-proxy. */}}
          {{- if and (or (eq $c.name "service") (eq $c.name "git-proxy")) (include "ecp.gitCA" $) }}
          - {name: git-ca, mountPath: /etc/eduide/git-ca, readOnly: true}
          {{- end }}
      volumes:
        {{- if eq $c.name "git-proxy" }}
        - name: config
          configMap:
            name: {{ $full }}-config
        - name: tmp
          emptyDir: {}
        {{- else }}
        {{- include "ecp.volumes" $ | nindent 8 }}
        {{- end }}
        {{- /* Only the service reads the Git account key and the OAuth client secrets. */}}
        {{- if and (eq $c.name "service") (include "ecp.gitEnabled" $) }}
        - name: git-accounts
          projected:
            sources:
            - secret:
                name: {{ include "ecp.gitKeySecret" $ }}
                items: [{key: key, path: encryption-key}]
            {{- range $p := $.Values.config.gitAccounts.providers }}
            - secret:
                name: {{ $p.clientSecretRef.name }}
                items: [{key: {{ $p.clientSecretRef.key | quote }}, path: {{ printf "client-secret-%s" $p.name }}}]
            {{- end }}
        {{- end }}
        {{- if and (or (eq $c.name "service") (eq $c.name "git-proxy")) (include "ecp.gitCA" $) }}
        - name: git-ca
          projected:
            sources:
            {{- range $p := $.Values.config.gitAccounts.providers }}
            {{- if $p.caConfigMapRef }}
            - configMap:
                name: {{ $p.caConfigMapRef.name }}
                items: [{key: {{ $p.caConfigMapRef.key | quote }}, path: {{ printf "%s.pem" $p.name }}}]
            {{- end }}
            {{- end }}
        {{- end }}
      {{- with $c.v.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.v.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.v.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if gt (int $c.v.replicas) 1 }}
      # Replicas go to different nodes where possible: with all authz replicas on one node, the loss of that
      # node denies every session request (ext_authz fails closed).
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            {{- include "ecp.selector" (dict "ctx" $ "component" $c.name) | nindent 12 }}
      {{- end }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $full }}-authz
  labels:
    {{- include "ecp.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "ecp.selector" (dict "ctx" . "component" "authz") | nindent 6 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $full }}-service
  labels:
    {{- include "ecp.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "ecp.selector" (dict "ctx" . "component" "service") | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-service
  labels:
    {{- include "ecp.labels" . | nindent 4 }}
    app.kubernetes.io/component: service
spec:
  selector:
    {{- include "ecp.selector" (dict "ctx" . "component" "service") | nindent 4 }}
  ports:
  - {name: http, port: 8080, targetPort: http}
  {{- if include "ecp.gitEnabled" . }}
  # Not routed by the gateway; a NetworkPolicy lets only git-proxy reach it.
  - {name: internal, port: 8083, targetPort: internal}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-authz
  labels:
    {{- include "ecp.labels" . | nindent 4 }}
    app.kubernetes.io/component: authz
spec:
  selector:
    {{- include "ecp.selector" (dict "ctx" . "component" "authz") | nindent 4 }}
  ports:
  - {name: grpc, port: 9001, targetPort: grpc, appProtocol: kubernetes.io/h2c}
{{- if include "ecp.gitEnabled" . }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $full }}-git-proxy
  labels:
    {{- include "ecp.labels" . | nindent 4 }}
spec:
  # maxUnavailable, not minAvailable: with one replica minAvailable 1 would block every node drain.
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "ecp.selector" (dict "ctx" . "component" "git-proxy") | nindent 6 }}
---
# ClusterIP only, and no HTTPRoute: the agents of session pods are its only clients.
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-git-proxy
  labels:
    {{- include "ecp.labels" . | nindent 4 }}
    app.kubernetes.io/component: git-proxy
spec:
  selector:
    {{- include "ecp.selector" (dict "ctx" . "component" "git-proxy") | nindent 4 }}
  ports:
  - {name: git, port: 8080, targetPort: git}
{{- end }}
