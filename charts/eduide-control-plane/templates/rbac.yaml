{{- $full := include "ecp.fullname" . }}
{{- /* Rules equal config/rbac/role.yaml; charts/test.sh checks it. */ -}}
{{- define "ecp.operatorRules" }}
{{- (.Files.Get "files/operator-rules.yaml" | fromYaml).rules | toYaml }}
{{- end }}
{{- range $c := list
  (dict "name" "operator" "rules" (include "ecp.operatorRules" . | fromYamlArray))
  (dict "name" "service" "rules" (list
    (dict "apiGroups" (list "eduide.github.io") "resources" (list "idetemplates" "idepools" "idesessions" "ideworkspaces") "verbs" (list "get" "list" "watch"))
    (dict "apiGroups" (list "eduide.github.io") "resources" (list "idesessions" "ideworkspaces") "verbs" (list "create" "delete"))
    (dict "apiGroups" (list "") "resources" (list "secrets") "verbs" (list "create" "get" "delete"))
    (dict "apiGroups" (list "events.k8s.io") "resources" (list "events") "verbs" (list "list" "watch"))
    (dict "apiGroups" (list "") "resources" (list "resourcequotas") "verbs" (list "get" "list"))))
  (dict "name" "authz" "rules" (list
    (dict "apiGroups" (list "eduide.github.io") "resources" (list "idesessions") "verbs" (list "list" "watch"))))
  (dict "name" "pool-scaler" "rules" (list
    (dict "apiGroups" (list "eduide.github.io") "resources" (list "idepools") "verbs" (list "get" "list" "watch"))
    (dict "apiGroups" (list "eduide.github.io") "resources" (list "idepools/scale") "verbs" (list "get" "patch" "update"))
    (dict "apiGroups" (list "eduide.github.io") "resources" (list "idetemplates") "verbs" (list "get" "list" "watch"))
    (dict "apiGroups" (list "") "resources" (list "pods" "resourcequotas") "verbs" (list "get" "list" "watch"))
    (dict "apiGroups" (list "events.k8s.io") "resources" (list "events") "verbs" (list "create"))))
}}
{{- if or (ne $c.name "pool-scaler") $.Values.poolScaler.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $full }}-{{ $c.name }}
  labels:
    {{- include "ecp.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $c.name }}
rules:
{{- toYaml $c.rules | nindent 0 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $full }}-{{ $c.name }}
  labels:
    {{- include "ecp.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $c.name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $full }}-{{ $c.name }}
subjects:
- kind: ServiceAccount
  name: {{ $full }}-{{ $c.name }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- if .Values.poolScaler.enabled }}
---
# The pool scaler's node budget reads allocatable capacity and the requests of all pods on the session nodes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $full }}-{{ .Release.Namespace }}-pool-scaler-nodes
  labels:
    {{- include "ecp.labels" . | nindent 4 }}
    app.kubernetes.io/component: pool-scaler
rules:
- apiGroups: [""]
  resources: [nodes, pods]
  verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $full }}-{{ .Release.Namespace }}-pool-scaler-nodes
  labels:
    {{- include "ecp.labels" . | nindent 4 }}
    app.kubernetes.io/component: pool-scaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $full }}-{{ .Release.Namespace }}-pool-scaler-nodes
subjects:
- kind: ServiceAccount
  name: {{ $full }}-pool-scaler
  namespace: {{ .Release.Namespace }}
{{- end }}
