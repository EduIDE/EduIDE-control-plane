{{- $full := include "ecp.fullname" . }}
{{- $host := .Values.config.hosts.instance }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $full }}-api
  labels:
    {{- include "ecp.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- include "ecp.parentRef" . | nindent 4 }}
  hostnames: [{{ .Values.config.hosts.service | quote }}]
  rules:
  - matches:
    - path: {type: PathPrefix, value: /api/}
    backendRefs:
    - {name: {{ $full }}-service, port: 8080}
---
# Catch-all for the instance and webview host. Session routes match longer prefixes and win. Every other path,
# such as an unknown instance id or the OIDC callback, passes the SecurityPolicy like a session path does (login redirect
# when anonymous, 403 when logged in) and only then reaches the service, which answers 404.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $full }}-session-fallback
  labels:
    {{- include "ecp.labels" . | nindent 4 }}
    eduide.github.io/route: session
spec:
  parentRefs:
    {{- include "ecp.parentRef" . | nindent 4 }}
  hostnames: [{{ $host | quote }}, {{ .Values.config.hosts.webview | default (printf "webview.%s" $host) | quote }}]
  rules:
  - matches:
    - path: {type: PathPrefix, value: /}
    backendRefs:
    - {name: {{ $full }}-service, port: 8080}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ $full }}-session
  labels:
    {{- include "ecp.labels" . | nindent 4 }}
spec:
  targetSelectors:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    matchLabels:
      eduide.github.io/route: session
  oidc:
    provider:
      issuer: {{ .Values.config.oidc.issuerURL | quote }}
      {{- with .Values.oidc.authorizationEndpoint }}
      authorizationEndpoint: {{ . | quote }}
      {{- end }}
      {{- with .Values.oidc.tokenEndpoint }}
      tokenEndpoint: {{ . | quote }}
      {{- end }}
      {{- with .Values.oidc.endSessionEndpoint }}
      endSessionEndpoint: {{ . | quote }}
      {{- end }}
      {{- with .Values.oidc.providerBackendRefs }}
      backendRefs:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    clientID: {{ .Values.config.oidc.gatewayClientID | quote }}
    clientSecret:
      name: {{ .Values.oidc.clientSecretName }}
    redirectURL: https://{{ $host }}/oauth2/callback
    logoutPath: /oauth2/logout
    cookieDomain: {{ $host | quote }}
    cookieNames:
      idToken: {{ .Values.config.oidc.idTokenCookie | default "eduide-id" | quote }}
    refreshToken: true
    # authz verifies the ID token cookie itself because ext_authz runs before oauth2 (ADR 0005);
    # the agent strips these cookies before requests reach the IDE.
    disableTokenEncryption: true
    scopes: [openid, profile, email]
  extAuth:
    failOpen: false
    grpc:
      backendRefs:
      - {name: {{ $full }}-authz, port: 9001}
