{{- if .Values.poolScaler.enabled }}
{{- $full := include "ecp.fullname" . }}
{{- $cfg := mergeOverwrite (dict "mode" .Values.poolScaler.mode) (deepCopy .Values.poolScaler.config) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $full }}-pool-scaler
  labels:
    {{- include "ecp.labels" . | nindent 4 }}
    app.kubernetes.io/component: pool-scaler
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $full }}-pool-scaler
  labels:
    {{- include "ecp.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- toYaml $cfg | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-pool-scaler
  labels:
    {{- include "ecp.labels" . | nindent 4 }}
    app.kubernetes.io/component: pool-scaler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ecp.selector" (dict "ctx" . "component" "pool-scaler") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ecp.labels" . | nindent 8 }}
        app.kubernetes.io/component: {{ "pool-scaler" }}
      annotations:
        checksum/config: {{ toYaml $cfg | sha256sum }}
    spec:
      serviceAccountName: {{ $full }}-pool-scaler
      securityContext:
        {{- include "ecp.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: pool-scaler
        image: {{ .Values.poolScaler.image.repository }}:{{ .Values.poolScaler.image.tag | default .Chart.AppVersion }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args: [--config, /etc/pool-scaler/config.yaml]
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        {{- with .Values.poolScaler.env }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        ports:
        - {name: metrics, containerPort: 9090}
        readinessProbe:
          httpGet: {path: /metrics, port: metrics}
        livenessProbe:
          httpGet: {path: /metrics, port: metrics}
        resources:
          {{- toYaml .Values.poolScaler.resources | nindent 10 }}
        securityContext:
          {{- include "ecp.containerSecurityContext" . | nindent 10 }}
        volumeMounts:
        - {name: config, mountPath: /etc/pool-scaler, readOnly: true}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: config
        configMap:
          name: {{ $full }}-pool-scaler
      - name: tmp
        emptyDir: {}
{{- end }}
