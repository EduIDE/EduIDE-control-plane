{{- range $t := .Values.templates }}
---
apiVersion: eduide.github.io/v1alpha1
kind: IDETemplate
metadata:
  name: {{ $t.name }}
  labels:
    {{- include "ecp.labels" $ | nindent 4 }}
spec:
  {{- toYaml $t.spec | nindent 2 }}
{{- if $t.pool }}
---
apiVersion: eduide.github.io/v1alpha1
kind: IDEPool
metadata:
  name: {{ $t.name }}
  labels:
    {{- include "ecp.labels" $ | nindent 4 }}
spec:
  templateRef: {{ $t.name }}
  {{- /* targetIdle belongs to the pool scaler (/scale); rendering it makes every Helm upgrade conflict with it. */}}
  {{- toYaml (omit $t.pool "targetIdle") | nindent 2 }}
{{- end }}
{{- end }}
