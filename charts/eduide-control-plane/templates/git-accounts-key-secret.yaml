{{- if and (include "ecp.gitEnabled" .) (not .Values.gitAccounts.encryptionKey.secretName) }}
{{- $name := include "ecp.gitKeySecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ecp.labels" . | nindent 4 }}
  annotations:
    # Losing the key makes every stored Git token unreadable: users connect again.
    helm.sh/resource-policy: keep
data:
  key: {{ if and $existing $existing.data }}{{ index $existing.data "key" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
{{- end }}
