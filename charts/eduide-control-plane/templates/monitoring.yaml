{{- $full := include "ecp.fullname" . }}
{{- with .Values.monitoring.podMonitor }}
{{- if .enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $full }}
  labels:
    {{- include "ecp.labels" $ | nindent 4 }}
    {{- with .labels }}{{ toYaml . | nindent 4 }}{{ end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: eduide-control-plane
      app.kubernetes.io/instance: {{ $.Release.Name }}
  podMetricsEndpoints:
  - port: metrics
    path: /metrics
    interval: {{ .interval }}
{{- end }}
{{- end }}
{{- with .Values.monitoring.rules }}
{{- if .enabled }}
{{- $extra := "" }}
{{- range $k, $v := .extraLabels }}{{ $extra = printf "%s, %s: %s" $extra $k (toJson $v) }}{{ end }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $full }}
  labels:
    {{- include "ecp.labels" $ | nindent 4 }}
    {{- with .labels }}{{ toYaml . | nindent 4 }}{{ end }}
spec:
  {{- $.Files.Get "files/alerts.yaml" | replace "__NAMESPACE__" $.Release.Namespace | replace "__FULLNAME__" $full | replace "__EXTRA_LABELS__" $extra | nindent 2 }}
  {{- $.Files.Get "files/usage-rules.yaml" | replace "__NAMESPACE__" $.Release.Namespace | nindent 2 }}
  {{- if .certificates }}
  {{- $.Files.Get "files/alerts-certificates.yaml" | replace "__NAMESPACE__" $.Release.Namespace | replace "__EXTRA_LABELS__" $extra | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
{{- with .Values.monitoring.dashboard }}
{{- if .enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $full }}-dashboard
  namespace: {{ .namespace | default $.Release.Namespace }}
  labels:
    {{- include "ecp.labels" $ | nindent 4 }}
    {{- with .labels }}{{ toYaml . | nindent 4 }}{{ end }}
data:
  eduide-control-plane.json: |
    {{- $.Files.Get "files/dashboard.json" | replace "__NAMESPACE__" $.Release.Namespace | nindent 4 }}
{{- end }}
{{- end }}
