{{- if not .Values.userSalt.secretName }}
{{- $name := include "ecp.userSaltSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ecp.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
data:
  salt: {{ if and $existing $existing.data }}{{ index $existing.data "salt" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
{{- end }}
