{{- /* Both legal pages are mandatory: exactly one of url or markdown each. Checked here as well, so --skip-schema-validation cannot bypass it. */}}
{{- if hasKey .Values.config "legal" }}
{{- fail "config.legal was removed: set legal.imprint and legal.privacy (each with url or markdown)" }}
{{- end }}
{{- $cfg := deepCopy .Values.config }}
{{- $legalCfg := dict }}
{{- $files := dict }}
{{- range $key := list "imprint" "privacy" }}
{{- $entry := get ($.Values.legal | default dict) $key }}
{{- if not (kindIs "map" $entry) }}
{{- fail (printf "legal.%s is required: set exactly one of url or markdown" $key) }}
{{- end }}
{{- if eq (hasKey $entry "url") (hasKey $entry "markdown") }}
{{- fail (printf "legal.%s needs exactly one of url or markdown" $key) }}
{{- end }}
{{- if hasKey $entry "url" }}
{{- if not (and (kindIs "string" $entry.url) (regexMatch "^https?://[^\\s]+$" $entry.url)) }}
{{- fail (printf "legal.%s.url must be an http or https URL" $key) }}
{{- end }}
{{- $_ := set $legalCfg $key (dict "url" $entry.url) }}
{{- else }}
{{- if not (and (kindIs "string" $entry.markdown) $entry.markdown) }}
{{- fail (printf "legal.%s.markdown must be a non-empty string" $key) }}
{{- end }}
{{- $_ := set $legalCfg $key (dict "path" (printf "/legal/%s.md" $key)) }}
{{- $_ := set $files (printf "%s.md" $key) $entry.markdown }}
{{- end }}
{{- end }}
{{- $_ := set $cfg "legal" $legalCfg }}
{{- $name := printf "%s-landing-page" .Release.Name | trunc 63 | trimSuffix "-" }}
{{- $labels := dict "app.kubernetes.io/name" "eduide-landing-page" "app.kubernetes.io/instance" .Release.Name }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- toYaml $labels | nindent 4 }}
data:
  config.json: |
    {{- $cfg | toPrettyJson | nindent 4 }}
  {{- range $file, $text := $files }}
  {{ $file }}: {{ $text | toJson }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- toYaml $labels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- toYaml $labels | nindent 8 }}
      annotations:
        checksum/config: {{ dict "config" $cfg "files" $files | toJson | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ add .Values.endpointDrainSeconds 15 }}
      containers:
      - name: landing-page
        image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        lifecycle:
          preStop:
            sleep: {seconds: {{ .Values.endpointDrainSeconds }}}
        ports:
        - {name: http, containerPort: 8080}
        readinessProbe:
          httpGet: {path: /, port: http}
        livenessProbe:
          httpGet: {path: /, port: http}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - {name: config, mountPath: /etc/eduide/landing, readOnly: true}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: config
        configMap:
          name: {{ $name }}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  selector:
    {{- toYaml $labels | nindent 4 }}
  ports:
  - {name: http, port: 8080, targetPort: http}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  parentRefs:
  - name: {{ .Values.gateway.name }}
    {{- with .Values.gateway.namespace }}
    namespace: {{ . }}
    {{- end }}
    {{- with .Values.gateway.sectionName }}
    sectionName: {{ . }}
    {{- end }}
    {{- with .Values.gateway.port }}
    port: {{ . }}
    {{- end }}
  hostnames: [{{ .Values.host | quote }}]
  rules:
  - matches:
    - path: {type: PathPrefix, value: /}
    backendRefs:
    - {name: {{ $name }}, port: 8080}
