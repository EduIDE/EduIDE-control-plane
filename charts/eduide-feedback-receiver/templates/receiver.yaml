{{- if .Values.enabled }}
{{- /* Checked here as well as in the schema, so --skip-schema-validation cannot bypass it. */}}
{{- $g := .Values.github }}
{{- range $k, $v := dict "host" .Values.host "gateway.name" .Values.gateway.name "installationKeysSecret" .Values.installationKeysSecret "github.appID" $g.appID "github.installationID" $g.installationID "github.repository" $g.repository "github.privateKeySecret.name" $g.privateKeySecret.name "github.privateKeySecret.key" $g.privateKeySecret.key }}
{{- if not $v }}
{{- fail (printf "%s is required when enabled is true" $k) }}
{{- end }}
{{- end }}
{{- if not (regexMatch "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$" $g.repository) }}
{{- fail "github.repository must be owner/name" }}
{{- end }}
{{- $name := printf "%s-feedback-receiver" .Release.Name | trunc 63 | trimSuffix "-" }}
{{- $labels := dict "app.kubernetes.io/name" "eduide-feedback-receiver" "app.kubernetes.io/instance" .Release.Name }}
{{- $np := .Values.networkPolicy }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- toYaml $labels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- toYaml $labels | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: feedback
        image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        - --keys-dir=/etc/feedback/keys
        - --github-api-url={{ $g.apiURL }}
        - --github-app-id={{ $g.appID }}
        - --github-installation-id={{ $g.installationID }}
        - --github-repository={{ $g.repository }}
        - --github-private-key=/etc/feedback/github/{{ $g.privateKeySecret.key }}
        env:
        - name: LOG_LEVEL
          value: {{ .Values.logLevel | quote }}
        ports:
        - {name: http, containerPort: 8080}
        readinessProbe:
          httpGet: {path: /healthz, port: http}
        livenessProbe:
          httpGet: {path: /healthz, port: http}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - {name: keys, mountPath: /etc/feedback/keys, readOnly: true}
        - {name: github, mountPath: /etc/feedback/github, readOnly: true}
      volumes:
      - name: keys
        secret:
          secretName: {{ .Values.installationKeysSecret }}
      - name: github
        secret:
          secretName: {{ $g.privateKeySecret.name }}
          items:
          - {key: {{ $g.privateKeySecret.key }}, path: {{ $g.privateKeySecret.key }}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  selector:
    {{- toYaml $labels | nindent 4 }}
  ports:
  - {name: http, port: 8080, targetPort: http}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  parentRefs:
  - name: {{ .Values.gateway.name }}
    {{- with .Values.gateway.namespace }}
    namespace: {{ . }}
    {{- end }}
    {{- with .Values.gateway.sectionName }}
    sectionName: {{ . }}
    {{- end }}
    {{- with .Values.gateway.port }}
    port: {{ . }}
    {{- end }}
  hostnames: [{{ .Values.host | quote }}]
  rules:
  - matches:
    - path: {type: PathPrefix, value: /v1/feedback}
    backendRefs:
    - {name: {{ $name }}, port: 8080}
{{- if $np.enabled }}
{{- $deny := concat $np.egressDeny $np.egressExtraDeny }}
{{- $deny4 := list }}
{{- $deny6 := list }}
{{- range $deny }}
{{- if contains ":" . }}{{ $deny6 = append $deny6 . }}{{ else }}{{ $deny4 = append $deny4 . }}{{ end }}
{{- end }}
---
# Ingress only from the gateway (ADR 0019). Egress only to DNS and the internet, because the receiver talks to GitHub only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $labels | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - namespaceSelector:
        {{- toYaml $np.envoy.namespaceSelector | nindent 8 }}
      podSelector:
        {{- toYaml $np.envoy.podSelector | nindent 8 }}
    ports:
    - {protocol: TCP, port: 8080}
  egress:
  - to:
    - namespaceSelector:
        {{- toYaml $np.dnsNamespaceSelector | nindent 8 }}
    ports:
    - {protocol: UDP, port: 53}
    - {protocol: TCP, port: 53}
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        {{- with $deny4 }}
        except:
          {{- toYaml . | nindent 10 }}
        {{- end }}
    - ipBlock:
        cidr: ::/0
        {{- with $deny6 }}
        except:
          {{- toYaml . | nindent 10 }}
        {{- end }}
    ports:
    - {protocol: TCP, port: 443}
{{- end }}
{{- end }}
