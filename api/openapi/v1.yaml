openapi: 3.1.0
info:
  title: EduIDE control plane API
  version: 1.0.0
  description: |
    Public REST API of the EduIDE service. Source of truth for server stubs and the TypeScript client.
    Rules (ADR 0010): only additive changes within v1; errors are RFC 9457 Problem Details with a stable `code`.
    All endpoints need an OIDC bearer token of the deployment's realm.
  license: {name: EPL-2.0}
servers:
  - url: /api/v1
security:
  - bearer: []
tags:
  - name: templates
  - name: sessions
  - name: workspaces
  - name: overview
paths:
  /templates:
    get:
      operationId: listTemplates
      tags: [templates]
      responses:
        "200":
          description: Templates of this deployment.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Template"}}
        default: {$ref: "#/components/responses/Problem"}
  /templates/events:
    get:
      operationId: watchTemplates
      tags: [templates]
      description: |
        Server-Sent Events. Event `templates` with the full template list (as `GET /templates`) as data.
        The stream starts with the current state, sends at most one event per 5 s and a comment (`: ping`) every 15 s.
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema: {type: string}
        default: {$ref: "#/components/responses/Problem"}
  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      responses:
        "200":
          description: Sessions of the calling user.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Session"}}
        default: {$ref: "#/components/responses/Problem"}
    post:
      operationId: launchSession
      tags: [sessions]
      description: |
        Launches a session. Idempotent (G14): the key is template plus workspace, or for sessions
        without persistence template plus a hash of the launch data. A repeated launch returns the
        existing session with 200. Send `traceparent` to join the launch trace.
      parameters:
        - {name: traceparent, in: header, required: false, schema: {type: string, maxLength: 55}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LaunchRequest"}
      responses:
        "200":
          description: Existing session for the same launch key.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "201":
          description: New session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        default: {$ref: "#/components/responses/Problem"}
  /sessions/{name}:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      operationId: getSession
      tags: [sessions]
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      operationId: deleteSession
      tags: [sessions]
      responses:
        "204": {description: "Stopping. The pod is discarded, a volume workspace stays."}
        "404":
          description: No session of the calling user has this name (`not-found`). Sessions of other users are not found either.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /sessions/{name}/events:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      operationId: watchSession
      tags: [sessions]
      description: |
        Server-Sent Events. Every change of the session is one event `session` with a Session as data.
        The stream starts with the current state. Comments (`: ping`) keep it open every 15 s.
        After phase Ready or Failed the server sends the final event and closes.
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema: {type: string}
        default: {$ref: "#/components/responses/Problem"}
  /workspaces:
    get:
      operationId: listWorkspaces
      tags: [workspaces]
      responses:
        "200":
          description: Workspaces of the calling user.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Workspace"}}
        default: {$ref: "#/components/responses/Problem"}
    post:
      operationId: createWorkspace
      tags: [workspaces]
      description: |
        Get-or-create: the workspace name is derived from user, template and `display.source`, so a repeated
        request returns the existing workspace (also with 201). Fails with `persistence-not-allowed` when the
        template does not allow persistence `volume`, and with `template-not-found` for an unknown template.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WorkspaceRequest"}
      responses:
        "201":
          description: The new or existing workspace.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Workspace"}
        default: {$ref: "#/components/responses/Problem"}
  /workspaces/{name}:
    parameters:
      - $ref: "#/components/parameters/Name"
    delete:
      operationId: deleteWorkspace
      tags: [workspaces]
      description: |
        Deletes a workspace and its files. A session that runs on the workspace is stopped first: the service
        deletes the session and waits until it is gone (at most 30 s), then deletes the workspace.
        The code `workspace-in-use` is unused since U14 and stays in the enum for compatibility.
      responses:
        "204": {description: "Deleted; a running session on it was stopped."}
        default: {$ref: "#/components/responses/Problem"}
  /me/overview:
    get:
      operationId: getOverview
      tags: [overview]
      description: Merged list for the landing page (G15). Running sessions and workspaces without a running session.
      responses:
        "200":
          description: Overview of the calling user.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Overview"}
        default: {$ref: "#/components/responses/Problem"}
  /me/overview/events:
    get:
      operationId: watchOverview
      tags: [overview]
      description: Server-Sent Events. Event `overview` with a full Overview as data on every change, starting with the current state.
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema: {type: string}
        default: {$ref: "#/components/responses/Problem"}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Name:
      name: name
      in: path
      required: true
      schema: {type: string, pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"}
  responses:
    Problem:
      description: Error as RFC 9457 Problem Details.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string, description: "URI reference, `about:blank` or `https://eduide.github.io/problems/<code>`"}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code:
          type: string
          description: Stable machine-readable code. New codes may be added within v1.
          enum: [unauthorized, forbidden, not-found, invalid-input, unknown-key, persistence-not-allowed, template-not-found, workspace-not-found, workspace-in-use, session-limit-reached, capacity-exhausted, start-failed, rate-limited, payload-too-large, internal]
        sessions:
          description: Running sessions of the user, only with `session-limit-reached`.
          type: array
          items: {$ref: "#/components/schemas/Session"}
    PersistenceMode:
      type: string
      enum: [none, volume]
    Display:
      type: object
      properties:
        title: {type: string, maxLength: 200}
        source: {type: string, maxLength: 2048}
    Template:
      type: object
      required: [name, displayName, persistence, defaultPersistence, injectableKeys]
      properties:
        name: {type: string}
        displayName: {type: string}
        logoUrl: {type: string}
        persistence: {type: array, items: {$ref: "#/components/schemas/PersistenceMode"}}
        defaultPersistence: {$ref: "#/components/schemas/PersistenceMode"}
        injectableKeys:
          description: Keys a launch request may send in `data`.
          type: array
          items: {type: string}
        warm: {type: boolean, description: "A pool prewarms sessions without persistence."}
        imageVersion: {type: string, description: "EduIDE version of the template image, read from the image annotation (U12). Absent without metadata."}
        variants:
          description: "Project templates of the image (U12). Launch one by sending its `id` as `data.TEMPLATE`. Absent without metadata."
          type: array
          items: {$ref: "#/components/schemas/TemplateVariant"}
        includes:
          description: What the image brings along, in groups with the versions installed at build time (U12).
          type: array
          items: {$ref: "#/components/schemas/TemplateIncludeGroup"}
        startEstimate: {$ref: "#/components/schemas/StartEstimates"}
    TemplateVariant:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        logoUrl: {type: string}
    TemplateIncludeGroup:
      type: object
      required: [group, items]
      properties:
        group: {type: string}
        items: {type: array, items: {$ref: "#/components/schemas/TemplateIncludeItem"}}
    TemplateIncludeItem:
      type: object
      required: [name]
      properties:
        name: {type: string}
        version: {type: string}
    StartEstimates:
      description: "Expected start time per persistence mode (U11), from the starts of the last hour. A mode without data is absent."
      type: object
      properties:
        none: {$ref: "#/components/schemas/StartEstimate"}
        volume: {$ref: "#/components/schemas/StartEstimate"}
    StartEstimate:
      type: object
      required: [seconds, strategy, samples]
      properties:
        seconds: {type: number, format: double, description: Median start duration.}
        strategy: {type: string, enum: [warm, cold], description: "warm when a pool has an idle ready instance now (only without persistence)."}
        samples: {type: integer, description: Number of observed starts the median is based on.}
    LaunchRequest:
      type: object
      required: [template]
      additionalProperties: false
      properties:
        template: {type: string, maxLength: 63}
        persistence:
          $ref: "#/components/schemas/PersistenceMode"
        workspace:
          type: string
          maxLength: 63
          description: Start on this existing workspace of the user. Implies persistence volume.
        data:
          type: object
          description: Launch data, only keys of the template's injectableKeys with source Request. At most 8 KiB in total (G18).
          maxProperties: 32
          additionalProperties: {type: string, maxLength: 8192}
        display: {$ref: "#/components/schemas/Display"}
    SessionPhase:
      type: string
      enum: [Pending, Starting, Ready, Failed]
    Session:
      type: object
      required: [name, template, phase, createdAt]
      properties:
        name: {type: string}
        template: {type: string}
        workspace: {type: string}
        phase: {$ref: "#/components/schemas/SessionPhase"}
        url: {type: string, description: "Set once phase is Ready."}
        startStrategy: {type: string, enum: [warm-ready, warm-starting, cold]}
        errorCode: {type: string}
        message: {type: string}
        display: {$ref: "#/components/schemas/Display"}
        createdAt: {type: string, format: date-time}
        readyAt: {type: string, format: date-time}
        lastActivity: {type: string, format: date-time}
        stopsAt:
          type: string
          format: date-time
          description: |
            When the session ends: the earlier of last activity (else ready time) plus the idle timeout and
            `createdAt` plus the maximum timeout (template timeouts, defaults 60m and 24h).
        stopReason: {type: string, enum: [idle, max], description: "Which timeout `stopsAt` stems from."}
    WorkspaceRequest:
      type: object
      required: [template]
      additionalProperties: false
      properties:
        template: {type: string, maxLength: 63}
        display: {$ref: "#/components/schemas/Display"}
    WorkspacePhase:
      type: string
      enum: [Pending, Ready, Expired]
    Workspace:
      type: object
      required: [name, template, phase, createdAt]
      properties:
        name: {type: string}
        template: {type: string}
        phase: {$ref: "#/components/schemas/WorkspacePhase"}
        display: {$ref: "#/components/schemas/Display"}
        createdAt: {type: string, format: date-time}
        lastUsed: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        deletesAt:
          type: string
          format: date-time
          description: |
            When workspace and volume are deleted: `expiresAt` plus the grace period (config workspaces.grace).
            Absent while a session runs on the workspace and with the retain annotation.
    OverviewItem:
      type: object
      required: [kind, title, template, running]
      properties:
        kind: {type: string, enum: [session, workspace]}
        title: {type: string, description: "From display.title, else derived from display.source (G15)."}
        source: {type: string}
        template: {type: string}
        templateDisplayName: {type: string}
        templateLogoUrl: {type: string}
        running: {type: boolean}
        lastUsed: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        stopsAt: {type: string, format: date-time, description: "Of the session, see Session.stopsAt."}
        deletesAt: {type: string, format: date-time, description: "Of the workspace, see Workspace.deletesAt."}
        session: {$ref: "#/components/schemas/Session"}
        workspace: {$ref: "#/components/schemas/Workspace"}
    Overview:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/OverviewItem"}}
