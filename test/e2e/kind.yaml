# Calico replaces kindnet because kindnet does not enforce NetworkPolicies.
# The gateway is reachable on 127.0.0.1:@E2E_PORT@ only (never on all interfaces).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: 10.244.0.0/16
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30443
        hostPort: @E2E_PORT@
        listenAddress: 127.0.0.1
        protocol: TCP
  - role: worker
  - role: worker
