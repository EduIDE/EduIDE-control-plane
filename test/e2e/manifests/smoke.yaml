# Proves the gateway OIDC filter with the test Keycloak and the test CA, independent of the control plane.
apiVersion: apps/v1
kind: Deployment
metadata: {name: smoke, namespace: eduide-e2e}
spec:
  replicas: 1
  selector: {matchLabels: {app: smoke}}
  template:
    metadata: {labels: {app: smoke}}
    spec:
      containers:
        - name: fake-ide
          image: ghcr.io/eduide/eduide-control-plane/fake-ide:e2e
          imagePullPolicy: Never
          env: [{name: FAKE_IDE_ADDR, value: "0.0.0.0:3000"}]
          ports: [{containerPort: 3000}]
---
apiVersion: v1
kind: Service
metadata: {name: smoke, namespace: eduide-e2e}
spec:
  selector: {app: smoke}
  ports: [{port: 3000, targetPort: 3000}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: smoke, namespace: eduide-e2e}
spec:
  parentRefs: [{name: eduide, sectionName: smoke}]
  hostnames: [smoke.e2e.test]
  rules:
    - backendRefs: [{name: smoke, port: 3000}]
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata: {name: smoke, namespace: eduide-e2e}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: smoke}]
  oidc:
    provider: {issuer: "https://keycloak.e2e.test/realms/eduide"}
    clientID: eduide-gateway
    clientSecret: {name: e2e-gateway-client}
    redirectURL: "https://smoke.e2e.test/oauth2/callback"
    logoutPath: /logout
    cookieNames: {idToken: eduide-id}
