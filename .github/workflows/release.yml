name: Release

# A tag vX.Y.Z versions everything together (U2): images are built by images.yml
# on the same tag; this workflow publishes the charts as OCI artifacts.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    paths: ['charts/**', '.github/workflows/release.yml']

permissions:
  contents: read

jobs:
  charts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release gate needs the history of main.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Version
        id: v
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "version=0.0.0-pr.$PR_NUMBER.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "app=pr-$PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            # Release gate: a version tag on a commit of main, nothing else.
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag is not vX.Y.Z"; exit 1; }
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tagged commit is not on main"; exit 1; }
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "app=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Package and push
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
          APP: ${{ steps.v.outputs.app }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for c in charts/*/; do
            helm package "$c" --version "$VERSION" --app-version "$APP" -d dist
          done
          for p in dist/*.tgz; do helm push "$p" oci://ghcr.io/eduide/eduide-control-plane/charts; done
