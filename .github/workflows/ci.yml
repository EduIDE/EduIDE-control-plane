name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly: a new CVE in unchanged code shows up without waiting for the next change.
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      go: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.f.outputs.go }}
      api: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.f.outputs.api }}
      scaler: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.f.outputs.scaler }}
      ts: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.f.outputs.ts }}
      landing: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.f.outputs.landing }}
      charts: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.f.outputs.charts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: f
        with:
          filters: |
            go: [go.mod, go.sum, 'api/**', 'cmd/**', 'internal/**', 'config/**', Makefile, .golangci.yml, 'build/**']
            api: ['api/**', 'config/crd/**']
            scaler: ['pool-scaler/**']
            ts: ['clients/**', 'extensions/**', 'api/openapi/**']
            landing: ['landing-page/**']
            charts: ['charts/**', 'config/crd/**']

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: {go-version-file: go.mod}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22}
      - name: go.mod is tidy
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: make generate without diff
        run: make verify-generate
      - name: Test (unit and envtest)
        run: make test-go
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with: {version: v2.15.0}
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: {go-version-file: go.mod}
      - name: OpenAPI lint
        run: |
          go run github.com/daveshanley/vacuum@v0.41.0 lint -d -r .github/vacuum.yaml api/openapi/v1.yaml
          go run github.com/daveshanley/vacuum@v0.41.0 lint -d -r .github/vacuum.yaml api/agent/v1.yaml
      - name: Breaking changes (oasdiff) and CRD schema diff
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p /tmp/base
          for f in api/openapi/v1.yaml api/agent/v1.yaml; do
            if git cat-file -e "$BASE:$f" 2>/dev/null; then
              git show "$BASE:$f" > /tmp/base/spec.yaml
              # ADR 0010: new enum values and error codes are additive within v1, so that rule only warns.
              go run github.com/oasdiff/oasdiff@v1.39.0 breaking /tmp/base/spec.yaml "$f" --fail-on ERR --severity-levels .github/oasdiff-levels.txt
            fi
          done
          go run ./hack/crddiff "$BASE"

  pool-scaler:
    needs: changes
    if: needs.changes.outputs.scaler == 'true'
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: pool-scaler}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: {go-version-file: pool-scaler/go.mod}
      - run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - run: go test -race -count=1 ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with: {version: v2.15.0, working-directory: pool-scaler}
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  typescript:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22}
      - name: Client
        working-directory: clients/typescript
        run: npm ci && npm audit --audit-level=high && npm run build && npm test
      - name: Extension eduide-session
        if: hashFiles('extensions/eduide-session/package.json') != ''
        working-directory: extensions/eduide-session
        run: npm ci && npm audit --audit-level=high && npm run lint && npm run build && npm test

  landing-page:
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: landing-page}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22}
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run check-client
      - run: npm run build
      - run: npm test --if-present
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: {go-version-file: landing-page/server/go.mod}
      - name: Static server
        working-directory: landing-page/server
        run: go vet ./... && go test -race ./...

  charts:
    needs: changes
    if: needs.changes.outputs.charts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Lint and template tests
        run: charts/test.sh

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - name: Gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.0 git /repo --redact --no-banner -v

  vuln-scan:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: {go-version-file: go.mod}
      - name: govulncheck (all Go modules)
        run: |
          for m in . pool-scaler landing-page/server; do
            (cd "$m" && go run golang.org/x/vuln/cmd/govulncheck@latest ./...)
          done
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  # The one check to require in branch protection. Path-filtered jobs are skipped on most
  # pull requests, so they cannot be required one by one; this job fails when any of them fails.
  ci-ok:
    if: always()
    needs: [changes, go, api, pool-scaler, typescript, landing-page, charts, gitleaks, vuln-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Every job is success or skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
