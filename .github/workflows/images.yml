name: Images

# Builds every image on pull requests (tag pr-<N>), on main (tags main and sha-<7>)
# and on release tags vX.Y.Z (tag X.Y.Z). Trivy scans the amd64 image before anything is pushed.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.event.pull_request.number || github.ref }}
  # Only pull requests cancel older builds; every main commit keeps its sha- image tag for deploys.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: operator, context: ., file: build/Dockerfile, args: CMD=operator}
          - {name: service, context: ., file: build/Dockerfile, args: CMD=service}
          - {name: authz, context: ., file: build/Dockerfile, args: CMD=authz}
          - {name: agent, context: ., file: build/Dockerfile, args: CMD=agent}
          - {name: fake-ide, context: test/fake-ide, file: test/fake-ide/Dockerfile, args: ""}
          - {name: pool-scaler, context: pool-scaler, file: pool-scaler/Dockerfile, args: ""}
          - {name: landing-page, context: landing-page, file: landing-page/Dockerfile, args: ""}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release gate needs the history of main.
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '1' }}
      - name: Release gate (version tag on a commit of main)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag is not vX.Y.Z"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tagged commit is not on main"; exit 1; }
      - name: Skip images whose Dockerfile does not exist yet
        id: exists
        env:
          FILE: ${{ matrix.file }}
        run: if [ -f "$FILE" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.exists.outputs.ok
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.exists.outputs.ok && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        if: steps.exists.outputs.ok
        id: meta
        with:
          images: ghcr.io/eduide/eduide-control-plane/${{ matrix.name }}
          tags: |
            type=ref,event=pr,prefix=pr-
            # Only main gets a branch tag: a branch named like a version must not overwrite a release image.
            type=ref,event=branch,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
      - name: Build amd64 for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.exists.outputs.ok
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: |
            ${{ matrix.args }}
            VERSION=${{ steps.meta.outputs.version }}-${{ github.sha }}
          platforms: linux/amd64
          load: true
          tags: scan/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
      - name: Trivy
        if: steps.exists.outputs.ok
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/${{ matrix.name }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      # Same builder, so the amd64 layers come from its cache and are the ones Trivy saw.
      - name: Build multi-arch and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.exists.outputs.ok
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: |
            ${{ matrix.args }}
            VERSION=${{ steps.meta.outputs.version }}-${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
