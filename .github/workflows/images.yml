name: Images

# Builds every image on pull requests (tag pr-<N>), on main (tags main and sha-<7>)
# and on release tags vX.Y.Z (tag X.Y.Z). Trivy scans each image.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: operator, context: ., file: build/Dockerfile, args: CMD=operator}
          - {name: service, context: ., file: build/Dockerfile, args: CMD=service}
          - {name: authz, context: ., file: build/Dockerfile, args: CMD=authz}
          - {name: agent, context: ., file: build/Dockerfile, args: CMD=agent}
          - {name: fake-ide, context: test/fake-ide, file: test/fake-ide/Dockerfile, args: ""}
          - {name: pool-scaler, context: pool-scaler, file: pool-scaler/Dockerfile, args: ""}
          - {name: landing-page, context: landing-page, file: landing-page/Dockerfile, args: ""}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Skip images whose Dockerfile does not exist yet
        id: exists
        run: if [ -f "${{ matrix.file }}" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v4.4.1
        if: steps.exists.outputs.ok
      - uses: docker/login-action@v4.8.0
        if: steps.exists.outputs.ok && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6.2.0
        if: steps.exists.outputs.ok
        id: meta
        with:
          images: ghcr.io/eduide/eduide-control-plane/${{ matrix.name }}
          tags: |
            type=ref,event=pr,prefix=pr-
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v7.4.0
        if: steps.exists.outputs.ok
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          load: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Trivy
        if: steps.exists.outputs.ok && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/eduide/eduide-control-plane/${{ matrix.name }}:${{ steps.meta.outputs.version }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
